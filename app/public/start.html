<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light only">
<link rel="icon" href="data:,">
<title>เริ่มใช้ฟรี — ใครอะ</title>
<link rel="stylesheet" href="/site.css">
<link rel="stylesheet" href="/member.css">
</head>
<body data-title-th="เริ่มใช้ฟรี — ใครอะ" data-title-en="Start free — KRAI-A">
<nav class="nav"></nav>

<main class="su">
  <ol class="su-steps" id="suSteps" aria-label="ขั้นตอน / Steps">
    <li data-step="phone" data-th="เบอร์ของคุณ" data-en="Your number">เบอร์ของคุณ</li>
    <li data-step="otp" data-th="ยืนยันรหัส" data-en="Verify">ยืนยันรหัส</li>
    <li data-step="setup" data-th="ตั้งโอนสาย" data-en="Forward calls">ตั้งโอนสาย</li>
  </ol>

  <section class="su-panel" id="pPhone" aria-labelledby="hPhone">
    <h1 class="m-h1" id="hPhone" data-th="เริ่มด้วยเบอร์มือถือของคุณ" data-en="Start with your mobile number">เริ่มด้วยเบอร์มือถือของคุณ</h1>
    <p class="m-lead" data-th="ไม่มีรหัสผ่าน เราส่งรหัส 6 หลักทาง SMS · ทดลองฟรี 7 วัน ไม่ต้องผูกบัตร" data-en="No password — we text you a 6-digit code · 7-day free trial, no card.">ไม่มีรหัสผ่าน เราส่งรหัส 6 หลักทาง SMS · ทดลองฟรี 7 วัน ไม่ต้องผูกบัตร</p>
    <form id="phoneForm" class="m-stack" novalidate>
      <div>
        <label class="m-label" for="phone" data-th="เบอร์มือถือ" data-en="Mobile number">เบอร์มือถือ</label>
        <input id="phone" class="m-input" type="tel" inputmode="tel" autocomplete="tel" placeholder="08x-xxx-xxxx" required aria-describedby="phoneErr">
        <p class="m-err" id="phoneErr" role="alert"></p>
      </div>
      <button class="btn primary big m-btn-block" id="sendBtn" type="submit" data-th="รับรหัส" data-en="Get code">รับรหัส</button>
    </form>
    <div class="su-or" data-th="หรือ" data-en="or">หรือ</div>
    <a class="btn secondary big m-btn-block su-line" href="/liff.html"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21 11.1C21 7 17 3.7 12 3.7S3 7 3 11.1c0 3.7 3.2 6.7 7.6 7.3.3.1.7.2.8.5.1.2.1.6 0 .8l-.1.8c0 .2-.2.9.8.5 1-.4 5.4-3.2 7.4-5.5 1-1.2 1.5-2.5 1.5-4.4z"/></svg><span data-th="ต่อด้วย LINE" data-en="Continue with LINE">ต่อด้วย LINE</span></a>
    <p class="m-fine" style="margin-top:16px;text-align:center" data-th="สมาชิกเดิม กรอกเบอร์เดิมเพื่อเข้าระบบ" data-en="Already a member? Enter the same number to log in.">สมาชิกเดิม กรอกเบอร์เดิมเพื่อเข้าระบบ</p>
  </section>

  <section class="su-panel" id="pOtp" aria-labelledby="hOtp" hidden>
    <h1 class="m-h1" id="hOtp" data-th="กรอกรหัส 6 หลัก" data-en="Enter the 6-digit code">กรอกรหัส 6 หลัก</h1>
    <p class="m-lead"><span data-th="ส่งไปที่" data-en="Sent to">ส่งไปที่</span> <b class="tnum" id="otpPhone"></b> · <button type="button" class="m-link" id="changeBtn" data-th="เปลี่ยนเบอร์" data-en="Change number">เปลี่ยนเบอร์</button></p>
    <div class="m-stack">
      <div id="devCode"></div>
      <div>
        <label class="vh" for="otp" data-th="รหัส 6 หลัก" data-en="6-digit code">รหัส 6 หลัก</label>
        <input id="otp" class="m-input m-otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="••••••" aria-describedby="otpErr">
        <p class="m-err" id="otpErr" role="alert"></p>
      </div>
      <button type="button" class="btn ghost" id="resendBtn" disabled></button>
    </div>
  </section>

  <section class="su-panel" id="pDone" hidden>
    <div class="su-verified" role="status"><span class="m-ok"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.7 2.7L16 10"/></svg><span data-th="ยืนยันแล้ว" data-en="Verified">ยืนยันแล้ว</span></span></div>
  </section>

  <section class="su-panel" id="pSetup" aria-live="polite" hidden></section>
</main>

<footer class="foot"></footer>

<script type="module" src="/start.js"></script>
</body>
</html>
