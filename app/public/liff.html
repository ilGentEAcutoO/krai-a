<style>
/* liff — old-system green-mint theme (tokens: krai-a/apps/liff/app.vue + site.css v4; all JS hooks + STR keys unchanged) */
*{box-sizing:border-box;margin:0}
:root{
--font:"Prompt",-apple-system,BlinkMacSystemFont,"Segoe UI","Sukhumvit Set",sans-serif;
--mono:"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
--paper:#F0F4F3;--mist:#E7F2EB;--card:#fff;
--ink:#1A1A2E;--ink2:#5B6470;--ink3:#9CA3AF;
--line:#D8E4DD;--line-soft:#E7EFE9;
--brand:#06C755;--brand-deep:#05A647;--brand-soft:#E8F8EE;
--bad:#EF4444;--bad-soft:rgba(239,68,68,.08);
--warn:#F59E0B;--warn-soft:rgba(245,158,11,.12);--warn-ink:#92400E;
--ok:#05A647;--ok-soft:#E8F8EE;
--sh:0 10px 15px -3px rgba(0,0,0,.08),0 4px 6px -2px rgba(0,0,0,.04);
--sh-sm:0 1px 2px rgba(0,0,0,.05);
}
body{font-family:var(--font);background:linear-gradient(160deg,#e8f8ee 0%,#f0f4f3 40%,#e0f2e9 100%) fixed,var(--paper);color:var(--ink);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
header{background:rgba(255,255,255,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--ink);padding:12px 16px;font-weight:700;font-size:17px;position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line)}
header .kdot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,#06C755,#05A647);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none}
header .sp{flex:1}
header #who{color:var(--ink3);font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.lang{position:relative;display:inline-block;flex:none}
.lang-btn{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 13px 7px 11px;font-family:var(--font);font-weight:600;font-size:13.5px;color:var(--ink2);cursor:pointer}
.lang-btn:hover{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);color:var(--ink)}
.lang-btn[aria-expanded="true"]{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);color:var(--ink)}
.lang-ic{width:16px;height:16px;color:var(--brand-deep);flex:none}
.lang-cur{min-width:46px;text-align:left}
.lang-chev{width:7px;height:7px;flex:none;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:rotate(45deg) translateY(-2px)}
.lang-btn[aria-expanded="true"] .lang-chev{transform:rotate(225deg);border-color:var(--brand-deep)}
.lang-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:172px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:6px;list-style:none;z-index:70;margin:0}
.lang-menu[hidden]{display:none}
.lang-menu li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer}
.lang-menu li:hover{background:var(--brand-soft);color:var(--ink)}
.lang-menu li:focus-visible{outline:3px solid var(--brand);outline-offset:-1px}
.lang-menu li[aria-selected="true"]{background:var(--ok-soft);color:var(--brand-deep)}
.lang-code{font-family:var(--mono);font-size:11px;font-weight:700;background:var(--mist);border:1px solid var(--line);color:var(--ink2);border-radius:6px;padding:2px 7px;flex:none}

.lang-tick{margin-left:auto;font-weight:700;color:var(--ok);opacity:0;flex:none}

.badge{display:inline-block;font-family:var(--mono);font-size:11.5px;font-weight:700;letter-spacing:.04em;border-radius:7px;padding:3px 10px}

select.pick{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:15px;margin-top:8px;font-family:var(--font);background:#fff;color:var(--ink)}

<script>
// Bilingual (same convention as site.js): data-th/data-en + `krai-a_lang` key.
const LANG_KEY='krai-a_lang';
const lang=()=>localStorage.getItem(LANG_KEY)==='en'?'en':'th';
function applyLang(){
  const l=lang();
  document.querySelectorAll('[data-th]').forEach(el=>{const v=l==='th'?el.dataset.th:('en' in el.dataset?el.dataset.en:el.dataset.th);if(v!==undefined&&el.innerHTML!==v)el.innerHTML=v;});
  document.querySelectorAll('[data-th-ph]').forEach(el=>{el.placeholder=l==='th'?el.dataset.thPh:('enPh' in el.dataset?el.dataset.enPh:el.dataset.thPh);});
  document.documentElement.lang=l;
  document.title=l==='th'?document.body.dataset.titleTh:document.body.dataset.titleEn;
  document.querySelectorAll('#langToggle').forEach(root=>{
    const cur=root.querySelector('[data-lang-cur]');
    if(cur){const label=l==='th'?'ไทย':'English';if(cur.textContent!==label)cur.textContent=label;}
    root.querySelectorAll('[role="option"][data-lang]').forEach(o=>o.setAttribute('aria-selected',String(o.dataset.lang===l)));
  });
}
document.querySelectorAll('#langToggle').forEach(wireLangMenu);
function wireLangMenu(root){
  const btn=root.querySelector('.lang-btn'),menu=root.querySelector('.lang-menu');
  if(!btn||!menu||root.dataset.wired)return;root.dataset.wired='1';
  const opts=[...menu.querySelectorAll('[role="option"][data-lang]')];
  const isOpen=()=>!menu.hidden;
  const close=(fb)=>{if(!isOpen())return;menu.hidden=true;btn.setAttribute('aria-expanded','false');if(fb)btn.focus();};
  const open=(fs)=>{menu.hidden=false;btn.setAttribute('aria-expanded','true');if(fs){const s=opts.find(o=>o.dataset.lang===lang())||opts[0];if(s)s.focus();}};
  const pick=(o)=>{localStorage.setItem(LANG_KEY,o.dataset.lang);applyLang();rerender();close(true);};
  btn.addEventListener('click',(e)=>{e.stopPropagation();isOpen()?close():open(false);});
  btn.addEventListener('keydown',(e)=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!isOpen())open(true);}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault();isOpen()?close():open(true);}
  });
  opts.forEach((o,i)=>{
    o.addEventListener('click',(e)=>{e.stopPropagation();pick(o);});
    o.addEventListener('keydown',(e)=>{
      if(e.key==='ArrowDown'){e.preventDefault();opts[(i+1)%opts.length].focus();}
      else if(e.key==='ArrowUp'){e.preventDefault();opts[(i-1+opts.length)%opts.length].focus();}
      else if(e.key==='Home'){e.preventDefault();opts[0].focus();}
      else if(e.key==='End'){e.preventDefault();opts[opts.length-1].focus();}
      else if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(o);}
      else if(e.key==='Escape'){e.preventDefault();close(true);}
      else if(e.key==='Tab'){close();}
    });
  });
  document.addEventListener('click',(e)=>{if(isOpen()&&!root.contains(e.target))close();});
  document.addEventListener('keydown',(e)=>{if(e.key==='Escape'&&isOpen())close(true);});
  root.addEventListener('focusout',(e)=>{if(isOpen()&&!root.contains(e.relatedTarget))close();});
}

  topupGo:{th:'กำลังเปิดหน้าชำระเงิน…',en:'Opening checkout…'},
  autoTitle:{th:'เติมอัตโนมัติ',en:'Auto top-up'},
  autoDesc:{th:'นาทีหรือสายเหลือถึงจุดที่ตั้งไว้ ระบบจะชาร์จบัตรที่บันทึกไว้ให้เอง',en:'When minutes or calls drop to your threshold, your saved card is charged.'},
  autoOn:{th:'เปิดเติมอัตโนมัติ',en:'Enable auto top-up'},
  autoThreshold:{th:'ชาร์จเมื่อเหลือ',en:'Charge when down to'},
  autoPack:{th:'แพ็กที่จะชาร์จ',en:'Pack to charge'},
  autoCardOk:{th:'พร้อมตัดบัตรที่บันทึกไว้อัตโนมัติ',en:'Your saved card will be charged automatically.'},
  autoManualNote:{th:'จ่ายด้วย PromptPay ตัดอัตโนมัติไม่ได้ — ต้องกดเติมเองทุกครั้ง',en:'PromptPay cannot auto-charge — please top up manually each time.'},
  autoSaved:{th:'บันทึกแล้ว ✓',en:'Saved ✓'},
  chargeNow:{th:'ชาร์จเลยตอนนี้',en:'Charge now'},
  paidOk:{th:'ชำระเงินสำเร็จ ✓ โควต้ากำลังเข้า',en:'Payment received ✓ — quota on the way.'},
  paidCancel:{th:'ยกเลิกการชำระเงินแล้ว',en:'Payment cancelled.'},
};
const t=(k)=>STR[k][lang()];
const $=(id)=>document.getElementById(id);
const err=(m)=>{const e=$('err');e.style.display=m?'block':'none';e.textContent=m||'';};
let token=localStorage.getItem('krai-a-session')||'';
let meCache=null;
let quotaCache=null;
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||r.status);return j}
function tab(name){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===name));document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='p-'+name));if(name==='calls')loadCalls();if(name==='allow')loadWL();if(name==='settings'){loadSet();if(token)loadQuota();}if(name==='status'&&token)loadQuota();}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.p));
const esc=(s)=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rerender(){if(meCache){renderStatus(meCache);renderLineCard(meCache);}if(quotaCache){renderQuota(quotaCache);renderBilling(quotaCache);}const on=document.querySelector('.tabs button.on')?.dataset.p;if(on==='calls')loadCalls();if(on==='allow')loadWL();if(on==='settings')loadSet();}
// Quota meter + topup + auto-billing (light surfaces only).
async function loadQuota(){
  if(!token)return;
  try{
    quotaCache=await api('/api/me/quota');
    renderQuota(quotaCache);renderBilling(quotaCache);
  }catch(e){$('quotaCard').innerHTML='<span class="muted">'+esc(e.message)+'</span>';}
}
const resetDate=(iso)=>{try{return new Date(iso).toLocaleDateString(lang()==='th'?'th-TH':'en-US',{day:'numeric',month:'short'});}catch(e){return '';}};
function checkoutNotice(){
  const p=new URLSearchParams(location.search);
  const paid=p.get('paid'), cancelled=p.get('cancelled');
  if(!paid&&!cancelled)return '';
  try{history.replaceState(null,'',location.pathname);}catch(e){}
  return paid?'<div class="qnote">'+esc(t('paidOk'))+'</div>':'<div class="muted">'+esc(t('paidCancel'))+'</div>';
}
function renderQuota(q){
  const pct=q.quota>0?Math.min(100,Math.round(q.remaining/q.quota*100)):0;
  const low=q.remaining<=Math.max(5,q.autoTopup.threshold)||q.autoTopup.manualPrompt||q.autoTopup.due;
  $('quotaCard').innerHTML=checkoutNotice()+`<b>${t('quotaTitle')}</b>
  <div class="num">${esc(q.remaining)}<span class="muted"> / ${esc(q.quota)} ${esc(t('minUnit'))}</span></div>
  <div class="qbar${low?' low':''}"><i style="width:${pct}%"></i></div>
  <div class="muted">${t('minOf')} ${esc(q.used)} · ${t('callsLeft')} ${esc(q.callsRemaining)} · ${t('quotaReset')} ${esc(resetDate(q.resetAt))}</div>
  ${low?'<div class="qlow">'+esc(t('quotaLow'))+'</div>':''}`;
}
const packPrice=(p)=>lang()==='th'?'฿'+p.price:'$'+p.usd;
function renderBilling(q){
  const region=lang()==='th'?'th':'intl'; // TH view pays THB, EN view pays USD
  const a=q.autoTopup||{};
  const b=q.autoTopupBounds||{min:1,max:30};
  const packs=Object.entries(q.packs||{}).map(([id,p])=>
    `<div class="pack"><div><b>+${p.minutes} ${esc(t('minUnit'))} +${p.calls} ${esc(t('callUnit'))}</b> · ${esc(packPrice(p))}</div>${q.canTopup?`<button data-pack="${esc(id)}">${esc(t('topupBtn'))}</button>`:''}</div>`).join('');
  const cardOnFile=q.payMethod==='card';
  const note=!a.enabled?'':cardOnFile?'<div class="qnote">'+esc(t('autoCardOk'))+'</div>':'<div class="qlow">'+esc(t('autoManualNote'))+'</div>';
  $('billCard').innerHTML=`<b>${t('topupTitle')}</b><div class="muted">${t('topupDesc')}</div>${packs}
  ${q.canTopup?'':'<div class="muted">'+esc(t('topupUnavail'))+'</div>'}
  <div style="margin-top:14px"><b>${t('autoTitle')}</b><div class="muted">${t('autoDesc')}</div>
  <label class="switch"><input type="checkbox" id="autoOn"${a.enabled?' checked':''}> ${t('autoOn')}</label>
  <div class="muted" style="margin-top:8px">${t('autoThreshold')}</div>
  <div class="stepper"><button id="thDown">−</button><b id="thVal" data-v="${a.threshold||5}">${a.threshold||5} ${esc(t('minUnit'))}</b><button id="thUp">+</button></div>
  <div class="muted" style="margin-top:8px">${t('autoPack')}</div>
  <select class="pick" id="autoPack">${Object.entries(q.packs||{}).map(([id,p])=>`<option value="${esc(id)}"${a.pack===id?' selected':''}>+${p.minutes} ${esc(t('minUnit'))} +${p.calls} ${esc(t('callUnit'))} · ${esc(packPrice(p))}</option>`).join('')}</select>
  ${note}
  ${a.due?'<button class="btn go" id="chargeNow">'+t('chargeNow')+'</button>':''}
  <div class="muted" id="billMsg"></div></div>`;
  $('billCard').querySelectorAll('[data-pack]').forEach(btn=>btn.onclick=()=>topup(btn.dataset.pack,region));
  $('autoOn').onchange=saveAuto;
  $('autoPack').onchange=saveAuto;
  $('thDown').onclick=()=>stepTh(-1,b.min,b.max);
  $('thUp').onclick=()=>stepTh(1,b.min,b.max);
  const cn=$('chargeNow');
  if(cn)cn.onclick=chargeNow;
}
function stepTh(d,min,max){
  const el=$('thVal');
  const v=Math.min(max,Math.max(min,(Number(el.dataset.v)||5)+d));
  el.dataset.v=v;el.textContent=v+' '+t('minUnit');
  saveAuto();
}
async function topup(pack,region){
  err('');$('billMsg').textContent=t('topupGo');
  try{
    const s=await api('/api/billing/checkout',{method:'POST',body:JSON.stringify({kind:'topup',pack,region,from:'liff'})});
    $('billMsg').textContent='';
    if(window.liff&&liff.openWindow)liff.openWindow({url:s.url,external:true});
    else location.href=s.url;
  }catch(e){$('billMsg').textContent='';err(e.message);}
}
function keepQuota(r){
  quotaCache={...quotaCache,...r.quota,packs:quotaCache.packs,canTopup:quotaCache.canTopup,autoTopupBounds:quotaCache.autoTopupBounds};
  renderQuota(quotaCache);renderBilling(quotaCache);
}
async function saveAuto(){
  err('');
  try{
    const r=await api('/api/me/auto-topup',{method:'POST',body:JSON.stringify({enabled:$('autoOn').checked,threshold:Number($('thVal').dataset.v||5),pack:$('autoPack').value})});
    keepQuota(r);
    $('billMsg').innerHTML='<span class="ok">'+t('autoSaved')+'</span>';
  }catch(e){err(e.message);}
}
async function chargeNow(){
  err('');
  try{
    const r=await api('/api/billing/auto-topup/charge',{method:'POST',body:'{}'});
    if(r.quota)keepQuota(r);
    $('billMsg').textContent=r.charged?t('paidOk'):t('autoManualNote');
  }catch(e){err(e.message);}
}
async function boot(){
  applyLang();
  try{
    const st=await (await fetch('/api/status')).json();
    if(!st.liffId)throw new Error(t('needLiff'));
    await liff.init({liffId:st.liffId});
    if(!liff.isLoggedIn()){liff.login();return;}
    const idToken=liff.getIDToken();
    if(!token){
      const r=await api('/api/auth/line-verify',{method:'POST',body:JSON.stringify({idToken})});
      if(r.needsLink){showLinkFlow(idToken);return;}
      token=r.token;localStorage.setItem('krai-a-session',token);
    }
    const me=await api('/api/me');
    meCache=me.member;
    $('who').textContent='· '+(me.member.ownerPhone||t('noNumber'));
    renderStatus(me.member);
    loadQuota();
    const deep=new URLSearchParams(location.search).get('liff.state');
    if(deep&&['status','calls','allow','settings'].includes(deep))tab(deep);
  }catch(e){err(t('bootFail')+e.message+t('retry'))}
}
// First run on an unknown LINE id: verify phone OTP, then bind this LINE.
function showLinkFlow(idToken){
  tab('status');
  $('stCard').innerHTML=`<b>${t('linkTitle')}</b><div class="muted">${t('linkDesc')}</div>
  <input id="lkPhone" inputmode="tel" placeholder="${esc(t('phonePh'))}">
  <button class="btn sub" id="lkSend">${t('sendOtp')}</button>
  <div id="lkStep2" style="display:none"><input id="lkCode" inputmode="numeric" maxlength="6" placeholder="${esc(t('codePh'))}">
  <button class="btn go" id="lkGo">${t('verifyLink')}</button></div><div class="muted" id="lkMsg"></div>`;
  $('lkSend').onclick=async()=>{err('');try{
    const r=await api('/api/auth/request-otp',{method:'POST',body:JSON.stringify({phone:$('lkPhone').value})});
    $('lkStep2').style.display='block';
    $('lkMsg').textContent=r.devCode?t('otpSent')+r.devCode+')':'';
  }catch(e){err(e.message==='invalid-phone'?t('badPhone'):e.message)}};
  $('lkGo').onclick=async()=>{err('');try{
    const v=await api('/api/auth/verify-otp',{method:'POST',body:JSON.stringify({phone:$('lkPhone').value,code:$('lkCode').value})});
    token=v.token;localStorage.setItem('krai-a-session',token);
    const linked=await api('/api/me/link-line',{method:'POST',body:JSON.stringify({idToken})});
    meCache=linked.member;
    $('who').textContent='· '+(linked.member.ownerPhone||t('noNumber'));
    renderStatus(linked.member);
    loadQuota();
  }catch(e){err(e.message==='line-already-linked'?t('lineTaken'):e.message)}};
}
function renderStatus(m){
  $('stCard').innerHTML=`<div class="muted">${t('aiNumber')}</div><div class="num">${esc(m.aiNumber)}</div>
  <div style="margin-top:8px">${t('fwdSetup')}<code>**21*${esc((m.aiNumber||'').replace(/^\+/,''))}#</code>${t('fwdThenCall')}</div>
  <div style="margin-top:6px">${t('fwdStatus')}${m.forwardingConfirmed?'<span class="ok">'+t('fwdOn')+'</span>':'<span class="warn">'+t('fwdOff')+'</span>'}</div>
  ${m.forwardingConfirmed?'':'<button class="btn go" onclick="confirmFwd()">'+t('iForwarded')+'</button>'}`;
}
async function confirmFwd(){await api('/api/me/forwarding',{method:'POST',body:'{}'});const me=await api('/api/me');meCache=me.member;renderStatus(me.member);}
async function loadCalls(){
  const box=$('callsCard');box.innerHTML=esc(t('loading'));
  try{
    const {calls}=await api('/api/me/calls');
    if(!calls.length){box.innerHTML='<span class="muted">'+esc(t('noCalls'))+'</span>';return;}
    box.innerHTML=calls.slice(0,10).map(c=>{const v=c.verdict?.verdict||'—';const cls=v==='SCAM'?'SC':v==='LEGIT'?'LG':'UN';
    return `<div class="row"><div><span class="badge ${cls}">${v}</span> <b>${esc(c.callerPhone)}</b><br><span class="muted">${esc(c.verdict?.reason||'')} · ${c.turns.length}${esc(t('turns'))}</span></div><a href="/api/me/calls/${c.id}/export" target="_blank">${esc(t('evidence'))}</a></div>`}).join('');
  }catch(e){box.innerHTML='<span class="muted">'+esc(e.message)+'</span>';}
}
async function loadWL(){
  const me=await api('/api/me');meCache=me.member;const list=me.member.whitelisted||[];
  $('wlList').innerHTML=list.length?list.map(w=>`<div class="row"><div><b>${esc(w.phone)}</b> <span class="muted">${esc(w.label||'')} · ${esc(w.safeWord||'')}</span></div><button class="x" data-p="${esc(w.phone)}">${esc(t('del'))}</button></div>`).join(''):'<span class="muted">'+esc(t('noneYet'))+'</span>';
  $('wlList').querySelectorAll('.x').forEach(b=>b.onclick=async()=>{await api('/api/me/whitelist',{method:'DELETE',body:JSON.stringify({phone:b.dataset.p})});loadWL();});
}
$('wlAdd').onclick=async()=>{err('');try{await api('/api/me/whitelist',{method:'POST',body:JSON.stringify({phone:$('wlPhone').value,safeWord:$('wlWord').value})});$('wlPhone').value='';$('wlWord').value='';loadWL();}catch(e){err(e.message)}};
function renderLineCard(m){
  const linked=!!m.lineUserId;
  $('lineCard').innerHTML=`<b>${t('lineTitle')}</b><div class="muted">${linked?'<span class="ok">'+t('lineLinked')+'</span>':t('lineNotLinked')}</div>
  ${linked?'':'<button class="btn go" id="lineLinkBtn">'+t('lineLinkBtn')+'</button>'}<div class="muted" id="lineMsg"></div>`;
  const btn=$('lineLinkBtn');
  if(btn)btn.onclick=async()=>{err('');try{
    const r=await api('/api/me/link-line',{method:'POST',body:JSON.stringify({idToken:liff.getIDToken()})});
    meCache=r.member;$('lineMsg').innerHTML='<span class="ok">'+t('lineLinkedOk')+'</span>';renderLineCard(r.member);
  }catch(e){err(e.message==='line-already-linked'?t('lineTaken'):e.message)}};
}
async function loadSet(){
  const me=await api('/api/me');const m=me.member;meCache=m;
  $('setCard').innerHTML=`<div class="row"><span>${t('plan')}</span><b>${esc(m.plan)}</b></div><div class="row"><span>${t('minUsed')}</span><b>${m.minutesUsed||0}</b></div><div class="row"><span>${t('mobile')}</span><b>${esc(m.ownerPhone||'—')}</b></div>`;
  renderLineCard(m);
  const ws=m.familyWatchers||[];
  $('wList').innerHTML=ws.length?ws.map(p=>`<div class="row"><b>${esc(p)}</b><button class="x" data-p="${esc(p)}">${esc(t('del'))}</button></div>`).join(''):'<span class="muted">'+esc(t('noneYet'))+'</span>';
  $('wList').querySelectorAll('.x').forEach(b=>b.onclick=async()=>{await api('/api/me/watchers',{method:'DELETE',body:JSON.stringify({phone:b.dataset.p})});loadSet();});
}
$('wAdd').onclick=async()=>{err('');try{await api('/api/me/watchers',{method:'POST',body:JSON.stringify({phone:$('wPhone').value})});$('wPhone').value='';loadSet();}catch(e){err(e.message)}};
boot();
</script>
</body>
</html>
